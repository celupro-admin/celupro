<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Definir credenciales de administración
    const USUARIO_CORRECTO = "admin";
    const CLAVE_CORRECTA = "1234";

    // Buscar la pantalla de login y el botón de entrada
    const loginScreen = document.getElementById('loginScreen');
    const inputUser = document.getElementById('loginUser');
    const inputPass = document.getElementById('loginPass');
    
    // Asignar el evento a cualquier botón o elemento clicable dentro del login
    if (loginScreen) {
      loginScreen.addEventListener('click', function(e) {
        // Detectar si se hizo clic en el botón "Entrar" o en su contenedor
        if (e.target && (e.target.innerText === 'Entrar' || e.target.closest('button') || e.target.tagName === 'BUTTON')) {
          e.preventDefault();
          
          const userVal = inputUser ? inputUser.value.trim() : '';
          const passVal = inputPass ? inputPass.value.trim() : '';

          if (userVal === USUARIO_CORRECTO && passVal === CLAVE_CORRECTA) {
            loginScreen.style.display = 'none';
          } else {
            alert('Usuario o contraseña incorrectos. Intenta con admin / 1234');
          }
        }
      });
    }
  });
</script>
</body>
</html>
