<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celupro - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">

  <!-- HEADER -->
  <header class="bg-white border-b border-slate-200 px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-black rounded-lg text-white font-bold flex items-center justify-center">CP</div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-wide">CELUPRO</h1>
          <p class="text-xs text-slate-500 font-medium">Sistema de Gestión</p>
        </div>
      </div>
    </div>

    <!-- HORA Y FECHA -->
    <div class="w-full md:w-auto text-center bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl shadow-sm">
      <div id="fecha-colombia" class="text-xs font-bold text-slate-700">Cargando fecha...</div>
      <div id="reloj-colombia" class="text-sm font-extrabold text-blue-600 font-mono">00:00:00</div>
    </div>

    <!-- BOTÓN CREAR ORDEN -->
    <div class="w-full md:w-auto">
      <button id="btnAbrirModal" type="button" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs px-5 py-2.5 rounded-xl shadow-md transition-colors cursor-pointer">
        + Crear Nueva Orden
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="p-4 space-y-6 max-w-7xl mx-auto w-full">

    <!-- MÉTRICAS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">Órdenes activas</p>
          <h3 id="cardOrdenesActivas" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
          <span id="cardTotalOrdenes" class="text-[11px] text-slate-400">0 total</span>
        </div>
        <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg">📋</div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">Ingresos del mes</p>
          <h3 id="cardIngresosMes" class="text-2xl font-bold text-slate-900 mt-1">$0.00</h3>
          <span id="cardIngresosTotal" class="text-[11px] text-emerald-600 font-medium">$0.00 histórico</span>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg">💲</div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">Clientes</p>
          <h3 id="cardClientes" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
          <span id="cardClientesMes" class="text-[11px] text-slate-400">0 este mes</span>
        </div>
        <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg">👥</div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">Por Cobrar</p>
          <h3 id="cardPorCobrar" class="text-2xl font-bold text-rose-600 mt-1">$0.00</h3>
          <span id="cardCantTrans" class="text-[11px] text-slate-400">0 pendientes</span>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg">💳</div>
      </div>
    </div>

    <!-- TABLA DE ÓRDENES -->
    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <h3 class="text-base font-bold text-slate-900">Órdenes recientes</h3>
        <input type="text" id="buscar" placeholder="Buscar cliente, equipo o ID..." class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-blue-500 w-full sm:w-64">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 text-slate-400 uppercase font-semibold border-b border-slate-100">
            <tr>
              <th class="py-3 px-3">ORDEN</th>
              <th class="py-3 px-3">CLIENTE</th>
              <th class="py-3 px-3">EQUIPO</th>
              <th class="py-3 px-3">ESTADO</th>
              <th class="py-3 px-3">TÉCNICO</th>
              <th class="py-3 px-3">COSTO</th>
              <th class="py-3 px-3 text-center">ACCIONES</th>
            </tr>
          </thead>
          <tbody id="listaOrdenes" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL NUEVA ORDEN -->
  <div id="modalOrden" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-sm items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl border border-slate-200 max-w-lg w-full p-6 shadow-2xl space-y-4 text-slate-800">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-base font-bold text-slate-900">Crear Nueva Orden</h3>
        <button id="btnCerrarModal" type="button" class="text-slate-400 hover:text-slate-600 font-bold text-xl px-2">&times;</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1">Nombre del Cliente</label>
          <input type="text" id="cliente" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Teléfono</label>
          <input type="text" id="telefono" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Equipo / Modelo</label>
          <input type="text" id="equipo" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Técnico Asignado</label>
          <select id="tecnico" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
            <option value="Robert">Robert</option>
            <option value="Técnico 2">Técnico 2</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Falla / Diagnóstico Inicial</label>
          <textarea id="falla" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs"></textarea>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs text-slate-500 mb-1">Total ($)</label>
            <input type="number" id="montoTotal" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2 py-2 text-xs">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">Abono ($)</label>
            <input type="number" id="montoAbono" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2 py-2 text-xs">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">Resta ($)</label>
            <input type="number" id="montoResta" value="0" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl px-2 py-2 text-xs text-rose-600 font-bold">
          </div>
        </div>

        <button id="btnGuardarOrden" type="button" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition-colors mt-2 shadow-md cursor-pointer">
          Guardar Orden
        </button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // VARIABLES GLOBALES
      let ordenes = [];
      let contadorID = 101;

      // ELEMENTOS DOM
      const modal = document.getElementById('modalOrden');
      const btnAbrirModal = document.getElementById('btnAbrirModal');
      const btnCerrarModal = document.getElementById('btnCerrarModal');
      const btnGuardarOrden = document.getElementById('btnGuardarOrden');
      const montoTotalInput = document.getElementById('montoTotal');
      const montoAbonoInput = document.getElementById('montoAbono');
      const buscarInput = document.getElementById('buscar');

      // 1. RELOJ EN TIEMPO REAL
      function actualizarReloj() {
        const ahora = new Date();
        const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        const fechaStr = ${dias[ahora.getDay()]}, ${ahora.getDate()} de ${meses[ahora.getMonth()]} de ${ahora.getFullYear()};
        
        let hrs = ahora.getHours();
        const ampm = hrs >= 12 ? 'PM' : 'AM';
        hrs = hrs % 12 || 12;
        const min = String(ahora.getMinutes()).padStart(2, '0');
        const sec = String(ahora.getSeconds()).padStart(2, '0');
        
        document.getElementById('fecha-colombia').textContent = fechaStr;
        document.getElementById('reloj-colombia').textContent = ${hrs}:${min}:${sec} ${ampm};
      }
      setInterval(actualizarReloj, 1000);
      actualizarReloj();

      // 2. CONTROL DEL MODAL
      btnAbrirModal.addEventListener('click', () => {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      });

      btnCerrarModal.addEventListener('click', cerrarModal);

      function cerrarModal() {
        modal.classList.remove('flex');
        modal.classList.add('hidden');
      }

      // 3. CÁLCULO DE RESTA
      function calcularSaldo() {
        const total = parseFloat(montoTotalInput.value) || 0;
        const abono = parseFloat(montoAbonoInput.value) || 0;
        document.getElementById('montoResta').value = Math.max(0, total - abono);
      }
      montoTotalInput.addEventListener('input', calcularSaldo);
      montoAbonoInput.addEventListener('input', calcularSaldo);

      // 4. GUARDAR ORDEN
      btnGuardarOrden.addEventListener('click', () => {
        const clienteVal = document.getElementById('cliente').value.trim();
        const equipoVal = document.getElementById('equipo').value.trim();

        if (!clienteVal || !equipoVal) {
          alert('Debes ingresar al menos el Cliente y el Equipo.');
          return;
        }

        const total = parseFloat(montoTotalInput.value) || 0;
        const abono = parseFloat(montoAbonoInput.value) || 0;

        const nuevaOrden = {
          id: '#ORD-' + contadorID,
          cliente: clienteVal,
          telefono: document.getElementById('telefono').value.trim() || 'N/A',
          equipo: equipoVal,
          falla: document.getElementById('falla').value.trim() || 'Sin diagnóstico',
          tecnico: document.getElementById('tecnico').value,
          total: total,
          abono: abono,
          resta: Math.max(0, total - abono),
          estado: 'En Revision',
          fecha: new Date().toISOString()
        };

        ordenes.unshift(nuevaOrden);
        contadorID++;

        localStorage.setItem('celupro_ordenes', JSON.stringify(ordenes));
        localStorage.setItem('celupro_contador', contadorID.toString());

        renderizarTodo();

        // Limpiar inputs
        document.getElementById('cliente').value = '';
        document.getElementById('telefono').value = '';
        document.getElementById('equipo').value = '';
        document.getElementById('falla').value = '';
        montoTotalInput.value = '0';
        montoAbonoInput.value = '0';
        document.getElementById('montoResta').value = '0';

        cerrarModal();
      });

      // 5. CARGAR Y RENDERIZAR
      function cargarDatos() {
        const ordenesGuardadas = localStorage.getItem('celupro_ordenes');
        const contadorGuardado = localStorage.getItem('celupro_contador');
        if (ordenesGuardadas) ordenes = JSON.parse(ordenesGuardadas);
        if (contadorGuardado) contadorID = parseInt(contadorGuardado);
      }

      function renderizarTodo() {
        renderizarTarjetas();
        renderizarOrdenes(ordenes);
      }

      function renderizarTarjetas() {
        const activas = ordenes.filter(o => o.estado !== 'Entregado').length;
        const ingresosTotal = ordenes.reduce((acc, o) => acc + (o.abono || 0), 0);
        const clientesUnicos = new Set(ordenes.map(o => o.cliente.toLowerCase())).size;
        const porCobrar = ordenes.reduce((acc, o) => acc + (o.resta || 0), 0);

        document.getElementById('cardOrdenesActivas').textContent = activas;
        document.getElementById('cardTotalOrdenes').textContent = ${ordenes.length} total;
        document.getElementById('cardIngresosMes').textContent = $${ingresosTotal.toFixed(2)};
        document.getElementById('cardClientes').textContent = clientesUnicos;
        document.getElementById('cardPorCobrar').textContent = $${porCobrar.toFixed(2)};
      }

      function renderizarOrdenes(lista) {
        const tbody = document.getElementById('listaOrdenes');
        tbody.innerHTML = '';

        if (lista.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-slate-400">No hay órdenes registradas aún.</td></tr>';
          return;
        }

        lista.forEach((ord, index) => {
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50 transition-colors';
          tr.innerHTML = `
            <td class="py-3.5 px-3 font-mono text-xs text-blue-600 font-bold">${ord.id}</td>
            <td class="py-3.5 px-3 font-medium text-slate-800">${ord.cliente}</td>
            <td class="py-3.5 px-3 text-slate-600">${ord.equipo}</td>
            <td class="py-3.5 px-3">
              <span class="text-xs rounded-full px-2.5 py-1 font-semibold border bg-slate-100 text-slate-700">${ord.estado}</span>
            </td>
            <td class="py-3.5 px-3 text-slate-600">${ord.tecnico}</td>
            <td class="py-3.5 px-3 font-semibold text-slate-900">$${ord.total}</td>
            <td class="py-3.5 px-3 text-center">
              <button data-index="${index}" class="btn-eliminar px-2 py-1 bg-rose-50 text-rose-600 border border-rose-200 text-xs rounded-lg hover:bg-rose-100">Eliminar</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        document.querySelectorAll('.btn-eliminar').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = e.target.getAttribute('data-index');
            if (confirm('¿Eliminar esta orden?')) {
              ordenes.splice(idx, 1);
              localStorage.setItem('celupro_ordenes', JSON.stringify(ordenes));
              renderizarTodo();
            }
          });
        });
      }

      buscarInput.addEventListener('input', () => {
        const q = buscarInput.value.toLowerCase();
        const res = ordenes.filter(o => o.cliente.toLowerCase().includes(q) || o.equipo.toLowerCase().includes(q) || o.id.toLowerCase().includes(q));
        renderizarOrdenes(res);
      });

      cargarDatos();
      renderizarTodo();
    });
  </script>
</body>
</html>
