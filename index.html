<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celupro - Sistema de Gestion</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- PANTALLA DE LOGIN (SIN FORMULARIO) -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-sm w-full shadow-2xl text-center">
      <img src="https://lh3.googleusercontent.com/d/138CSSMy9-2dI3AS_oNIs810VttVU9_nb" alt="Celupro Logo" class="w-20 h-20 mx-auto mb-3 object-contain rounded-xl bg-black p-1 border border-slate-700 shadow-md">
      
      <h1 class="text-2xl font-bold tracking-wide text-white">CELUPRO</h1>
      <p class="text-xs text-slate-400 mb-6">Sistema de Gestion de Servicio Tecnico</p>
      
      <div class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Usuario</label>
          <input type="text" id="loginUser" value="admin" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Contrasena</label>
          <input type="password" id="loginPass" value="1234" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        
        <button id="btnEntrarLogin" type="button" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg transition-colors mt-2 shadow-lg shadow-blue-600/30">
          Entrar
        </button>
      </div>
    </div>
  </div>

  <!-- PANEL PRINCIPAL -->
  <div class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800 p-4 rounded-xl border border-slate-700">
      <div class="flex items-center gap-3">
        <img src="https://lh3.googleusercontent.com/d/138CSSMy9-2dI3AS_oNIs810VttVU9_nb" alt="Celupro Logo" class="w-10 h-10 object-contain rounded-lg bg-black p-1 border border-slate-700">
        <div>
          <h1 class="text-xl font-bold text-white tracking-wide">CELUPRO</h1>
          <p class="text-xs text-slate-400">Control de Servicio Tecnico</p>
        </div>
      </div>
      <button onclick="document.getElementById('loginScreen').style.display='flex'" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg transition-colors text-slate-300">
        Cerrar Sesion
      </button>
    </header>

    <main class="bg-slate-800 rounded-xl border border-slate-700 p-6 shadow-xl">
      <h2 class="text-lg font-bold text-white mb-4">Panel de Control</h2>
      <p class="text-slate-300 text-sm">Bienvenido al sistema Celupro. Todo el sistema esta activo y listo para usarse.</p>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loginScreen = document.getElementById('loginScreen');
      const btnEntrar = document.getElementById('btnEntrarLogin');

      if (btnEntrar && loginScreen) {
        btnEntrar.addEventListener('click', function(e) {
          e.preventDefault();
          loginScreen.style.display = 'none';
        });
      }
    });
  </script>
</body>
</html>
