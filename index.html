<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celupro - Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f1f5f9; color: #334155; padding-bottom: 40px; }
    
    header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .logo-container { display: flex; align-items: center; gap: 12px; }
    .logo-img { height: 45px; width: auto; max-width: 160px; object-fit: contain; }
    .title-box h1 { font-size: 18px; color: #0f172a; line-height: 1.2; }
    .title-box p { font-size: 12px; color: #64748b; }
    
    .btn-principal { background: #2563eb; color: #fff; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-secundario { background: #e2e8f0; color: #475569; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; }

    main { max-width: 1100px; margin: 20px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 20px; }
    
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .card { background: #fff; border: 1px solid #e2e8f0; padding: 16px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; }
    .card p { font-size: 12px; color: #64748b; font-weight: 500; }
    .card h3 { font-size: 22px; color: #0f172a; margin: 4px 0; font-weight: bold; }
    .card span { font-size: 11px; color: #94a3b8; }

    .form-card { background: #fff; border: 2px solid #2563eb; border-radius: 16px; padding: 20px; display: none; margin-bottom: 10px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: #475569; font-weight: 600; }
    .form-group input, .form-group select { border: 1px solid #cbd5e1; background: #f8fafc; padding: 10px; border-radius: 8px; font-size: 13px; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

    .table-container { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; }
    .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .search-input { border: 1px solid #cbd5e1; background: #f8fafc; padding: 10px 12px; border-radius: 10px; font-size: 13px; width: 100%; max-width: 300px; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #f8fafc; color: #64748b; padding: 10px; font-size: 11px; border-bottom: 1px solid #e2e8f0; }
    td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; }
    
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #f1f5f9; color: #475569; }
    .btn-danger { background: #ffe4e6; color: #e11d48; border: 1px solid #fecdd3; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 11px; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/138CSSMy9-2dI3AS_oNIs8l0VttVU9_nb" alt="CELUPRO Logo" class="logo-img">
      <div class="title-box">
        <h1>CELUPRO</h1>
        <p>Sistema de Gestión</p>
      </div>
    </div>

    <button type="button" class="btn-principal" onclick="abrirFormulario()">+ Crear Nueva Orden</button>
  </header>

  <main>
    <div class="cards-grid">
      <div class="card">
        <div>
          <p>Órdenes activas</p>
          <h3 id="cardOrdenesActivas">0</h3>
          <span id="cardTotalOrdenes">0 total</span>
        </div>
      </div>
      <div class="card">
        <div>
          <p>Ingresos del mes</p>
          <h3 id="cardIngresosMes">$0.00</h3>
        </div>
      </div>
      <div class="card">
        <div>
          <p>Clientes</p>
          <h3 id="cardClientes">0</h3>
        </div>
      </div>
      <div class="card">
        <div>
          <p>Por Cobrar</p>
          <h3 id="cardPorCobrar" style="color:#e11d48;">$0.00</h3>
        </div>
      </div>
    </div>

    <div id="seccionFormulario" class="form-card">
      <h3 style="color:#0f172a; font-size:16px;">Registrar Nueva Orden</h3>
      
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre del Cliente *</label>
          <input type="text" id="cliente" placeholder="Ej: Eugenio">
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" id="telefono" placeholder="Ej: 300123456">
        </div>

        <div class="form-group">
          <label>Equipo / Modelo *</label>
          <input type="text" id="equipo" placeholder="Ej: iPhone 15">
        </div>

        <div class="form-group">
          <label>Técnico Asignado</label>
          <select id="tecnico">
            <option value="Robert">Robert</option>
            <option value="Andrés Anzola">Andrés Anzola</option>
          </select>
        </div>

        <div class="form-group" style="grid-column: span 2;">
          <label>Falla / Diagnóstico Inicial</label>
          <input type="text" id="falla" placeholder="Describa la falla...">
        </div>

        <div class="form-group">
          <label>Costo Total ($)</label>
          <input type="number" id="montoTotal" value="0" oninput="calcularResta()">
        </div>

        <div class="form-group">
          <label>Abono ($)</label>
          <input type="number" id="montoAbono" value="0" oninput="calcularResta()">
        </div>

        <div class="form-group">
          <label>Resta Pendiente ($)</label>
          <input type="number" id="montoResta" value="0" readonly style="color:#e11d48; font-weight:bold;">
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secundario" onclick="cerrarFormulario()">Cancelar</button>
        <button type="button" class="btn-principal" onclick="guardarOrden()">Guardar Orden</button>
      </div>
    </div>

    <div class="table-container">
      <div class="table-header">
        <h3 style="font-size:16px; color:#0f172a;">Órdenes recientes</h3>
        <input type="text" id="buscar" class="search-input" placeholder="Buscar cliente, equipo o ID..." oninput="filtrarOrdenes()">
      </div>

      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ORDEN</th>
              <th>CLIENTE</th>
              <th>EQUIPO</th>
              <th>ESTADO</th>
              <th>TÉCNICO</th>
              <th>TOTAL</th>
              <th style="text-align:center;">ACCIONES</th>
            </tr>
          </thead>
          <tbody id="listaOrdenes"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    var ordenes = [];
    var contadorID = 101;

    function abrirFormulario() {
      document.getElementById('seccionFormulario').style.display = 'block';
    }

    function cerrarFormulario() {
      document.getElementById('seccionFormulario').style.display = 'none';
    }

    function calcularResta() {
      var total = parseFloat(document.getElementById('montoTotal').value) || 0;
      var abono = parseFloat(document.getElementById('montoAbono').value) || 0;
      var resta = total - abono;
      document.getElementById('montoResta').value = resta > 0 ? resta : 0;
    }

    function guardarOrden() {
      var clienteVal = document.getElementById('cliente').value.trim();
      var equipoVal = document.getElementById('equipo').value.trim();

      if (!clienteVal || !equipoVal) {
        alert('Por favor completa el Nombre del Cliente y el Equipo.');
        return;
      }

      var total = parseFloat(document.getElementById('montoTotal').value) || 0;
      var abono = parseFloat(document.getElementById('montoAbono').value) || 0;

      var nuevaOrden = {
        id: '#ORD-' + contadorID,
        cliente: clienteVal,
        telefono: document.getElementById('telefono').value.trim() || 'N/A',
        equipo: equipoVal,
        falla: document.getElementById('falla').value.trim() || 'Sin diagnóstico',
        tecnico: document.getElementById('tecnico').value,
        total: total,
        abono: abono,
        resta: Math.max(0, total - abono),
        estado: 'En Revision'
      };

      ordenes.unshift(nuevaOrden);
      contadorID++;

      localStorage.setItem('celupro_ordenes', JSON.stringify(ordenes));
      localStorage.setItem('celupro_contador', contadorID.toString());

      renderizarTodo();

      document.getElementById('cliente').value = '';
      document.getElementById('telefono').value = '';
      document.getElementById('equipo').value = '';
      document.getElementById('falla').value = '';
      document.getElementById('montoTotal').value = '0';
      document.getElementById('montoAbono').value = '0';
      document.getElementById('montoResta').value = '0';

      cerrarFormulario();
    }

    function renderizarTodo() {
      var activas = ordenes.filter(function(o) { return o.estado !== 'Entregado'; }).length;
      var ingresosTotal = ordenes.reduce(function(acc, o) { return acc + (o.abono || 0); }, 0);
      var clientesUnicos = new Set(ordenes.map(function(o) { return o.cliente.toLowerCase(); })).size;
      var porCobrar = ordenes.reduce(function(acc, o) { return acc + (o.resta || 0); }, 0);

      document.getElementById('cardOrdenesActivas').textContent = activas;
      document.getElementById('cardTotalOrdenes').textContent = ordenes.length + ' total';
      document.getElementById('cardIngresosMes').textContent = '$' + ingresosTotal.toFixed(2);
      document.getElementById('cardClientes').textContent = clientesUnicos;
      document.getElementById('cardPorCobrar').textContent = '$' + porCobrar.toFixed(2);

      renderizarTabla(ordenes);
    }

    function renderizarTabla(lista) {
      var tbody = document.getElementById('listaOrdenes');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#94a3b8;">No hay órdenes registradas aún.</td></tr>';
        return;
      }

      for (var i = 0; i < lista.length; i++) {
        var ord = lista[i];
        var tr = document.createElement('tr');
        tr.innerHTML = '<td><b>' + ord.id + '</b></td>' +
                       '<td><b>' + ord.cliente + '</b></td>' +
                       '<td>' + ord.equipo + '</td>' +
                       '<td><span class="badge">' + ord.estado + '</span></td>' +
                       '<td>' + ord.tecnico + '</td>' +
                       '<td><b>$' + ord.total + '</b></td>' +
                       '<td style="text-align:center;"><button class="btn-danger" onclick="eliminarOrden(' + i + ')">Eliminar</button></td>';
        tbody.appendChild(tr);
      }
    }

    function eliminarOrden(index) {
      if (confirm('¿Eliminar esta orden?')) {
        ordenes.splice(index, 1);
        localStorage.setItem('celupro_ordenes', JSON.stringify(ordenes));
        renderizarTodo();
      }
    }

    function filtrarOrdenes() {
      var q = document.getElementById('buscar').value.toLowerCase();
      var filtradas = ordenes.filter(function(o) {
        return o.cliente.toLowerCase().indexOf(q) !== -1 || 
               o.equipo.toLowerCase().indexOf(q) !== -1 || 
               o.id.toLowerCase().indexOf(q) !== -1;
      });
      renderizarTabla(filtradas);
    }

    window.onload = function() {
      var ords = localStorage.getItem('celupro_ordenes');
      var cnt = localStorage.getItem('celupro_contador');
      if (ords) ordenes = JSON.parse(ords);
      if (cnt) contadorID = parseInt(cnt);
      renderizarTodo();
    };
  </script>
</body>
</html>
