<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celupro - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">

  <!-- HEADER SUPERIOR -->
  <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
      <div class="flex items-center gap-3">
        <img src="https://lh3.googleusercontent.com/d/138CSSMy9-2dI3AS_oNIs8l0VttVU9_nb" alt="Celupro Logo" class="w-10 h-10 object-contain rounded-lg bg-black p-1 border border-slate-700">
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-wide">CELUPRO</h1>
          <p class="text-xs text-slate-500 font-medium">Sistema de Gestión</p>
        </div>
      </div>
    </div>

    <!-- FECHA Y HORA EN TIEMPO REAL -->
    <div class="w-full md:w-auto text-center bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl shadow-sm leading-tight">
      <div id="fecha-colombia" class="text-xs sm:text-sm font-bold text-slate-700">--</div>
      <div id="reloj-colombia" class="text-sm sm:text-base font-extrabold text-blue-600 font-mono">--:--:--</div>
    </div>

    <!-- BOTÓN CREAR ORDEN -->
    <div class="w-full md:w-auto">
      <button onclick="abrirModal()" type="button" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs px-5 py-2.5 rounded-xl shadow-md transition-colors cursor-pointer">
        + Crear Nueva Orden
      </button>
    </div>
  </header>

  <main class="p-4 sm:p-6 md:p-8 space-y-6 max-w-7xl mx-auto w-full">

    <!-- TARJETAS DE MÉTRICAS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">Órdenes activas</p>
          <h3 id="cardOrdenesActivas" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
          <span id="cardTotalOrdenes" class="text-[11px] text-slate-400">0 total</span>
        </div>
        <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg font-bold">📋</div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">Ingresos del mes</p>
          <h3 id="cardIngresosMes" class="text-2xl font-bold text-slate-900 mt-1">$0.00</h3>
          <span id="cardIngresosTotal" class="text-[11px] text-emerald-600 font-medium">$0.00 histórico</span>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg font-bold">💲</div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">Clientes</p>
          <h3 id="cardClientes" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
          <span id="cardClientesMes" class="text-[11px] text-slate-400">0 este mes</span>
        </div>
        <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg font-bold">👥</div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">Transacciones (Por Cobrar)</p>
          <h3 id="cardPorCobrar" class="text-2xl font-bold text-rose-600 mt-1">$0.00</h3>
          <span id="cardCantTrans" class="text-[11px] text-slate-400">0 pendientes</span>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg font-bold">💳</div>
      </div>
    </div>

    <!-- TABLA DE ÓRDENES -->
    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <h3 class="text-base font-bold text-slate-900">Órdenes recientes</h3>
        <input type="text" id="buscar" oninput="filtrarOrdenes()" placeholder="Buscar cliente, equipo o ID..." class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-blue-500 w-full sm:w-64">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 text-slate-400 uppercase font-semibold border-b border-slate-100">
            <tr>
              <th class="py-3 px-3">ORDEN</th>
              <th class="py-3 px-3">CLIENTE</th>
              <th class="py-3 px-3">EQUIPO</th>
              <th class="py-3 px-3">ESTADO</th>
              <th class="py-3 px-3">TÉCNICO</th>
              <th class="py-3 px-3">COSTO</th>
              <th class="py-3 px-3 text-center">ACCIONES</th>
            </tr>
          </thead>
          <tbody id="listaOrdenes" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL NUEVA ORDEN -->
  <div id="modalOrden" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-sm items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl border border-slate-200 max-w-lg w-full p-6 shadow-2xl space-y-4 text-slate-800">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-base font-bold text-slate-900">Crear Nueva Orden de Reparación</h3>
        <button onclick="cerrarModal()" type="button" class="text-slate-400 hover:text-slate-600 font-bold text-xl px-2">&times;</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1">Nombre del Cliente</label>
          <input type="text" id="cliente" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Teléfono</label>
          <input type="text" id="telefono" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Equipo / Modelo</label>
          <input type="text" id="equipo" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Técnico Asignado</label>
          <select id="tecnico" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
            <option value="Robert">Robert</option>
            <option value="Técnico 2">Técnico 2</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Falla / Diagnóstico Inicial</label>
          <textarea id="falla" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-blue-500"></textarea>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs text-slate-500 mb-1">Total ($)</label>
            <input type="number" id="montoTotal" value="0" oninput="calcularSaldo()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2 py-2 text-xs text-slate-800 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">Abono ($)</label>
            <input type="number" id="montoAbono" value="0" oninput="calcularSaldo()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2 py-2 text-xs text-slate-800 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">Resta ($)</label>
            <input type="number" id="montoResta" value="0" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl px-2 py-2 text-xs text-rose-600 font-bold focus:outline-none">
          </div>
        </div>

        <button onclick="guardarOrden()" type="button" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition-colors mt-2 shadow-md cursor-pointer">
          Guardar Orden
        </button>
      </div>
    </div>
  </div>

  <script>
    // LÓGICA DEL RELOJ COLOMBIA (AISLADA)
    function mostrarHoraColombia() {
      try {
        const d = new Date();
        const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
        const fechaCO = new Date(utc + (3600000 * -5));

        const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        const nombreDia = dias[fechaCO.getDay()];
        const diaNum = fechaCO.getDate();
        const nombreMes = meses[fechaCO.getMonth()];
        const anio = fechaCO.getFullYear();

        let horas = fechaCO.getHours();
        let minutos = fechaCO.getMinutes();
        let segundos = fechaCO.getSeconds();
        const ampm = horas >= 12 ? 'PM' : 'AM';

        horas = horas % 12;
        horas = horas ? horas : 12; 
        minutos = minutos < 10 ? '0' + minutos : minutos;
        segundos = segundos < 10 ? '0' + segundos : segundos;

        const elFecha = document.getElementById('fecha-colombia');
        const elReloj = document.getElementById('reloj-colombia');

        if (elFecha) elFecha.textContent = ${nombreDia}, ${diaNum} de ${nombreMes} de ${anio};
        if (elReloj) elReloj.textContent = ${horas}:${minutos}:${segundos} ${ampm};
      } catch (e) {
        console.error("Error reloj:", e);
      }
    }

    setInterval(mostrarHoraColombia, 1000);
    mostrarHoraColombia();

    // LÓGICA DEL DASHBOARD Y ORDENES
    let ordenes = [];
    let contadorID = 101;

    function abrirModal() {
      const modal = document.getElementById('modalOrden');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function cerrarModal() {
      const modal = document.getElementById('modalOrden');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    function calcularSaldo() {
      const total = parseFloat(document.getElementById('montoTotal').value) || 0;
      const abono = parseFloat(document.getElementById('montoAbono').value) || 0;
      document.getElementById('montoResta').value = Math.max(0, total - abono);
    }

    function guardarOrden() {
      const clienteInput = document.getElementById('cliente');
      const equipoInput = document.getElementById('equipo');

      const clienteVal = clienteInput ? clienteInput.value.trim() : '';
      const equipoVal = equipoInput ? equipoInput.value.trim() : '';

      if (!clienteVal || !equipoVal) {
        alert('Ingresa al menos el nombre del Cliente y el Equipo');
        return;
      }

      const total = parseFloat(document.getElementById('montoTotal').value) || 0;
      const abono = parseFloat(document.getElementById('montoAbono').value) || 0;

      const nuevaOrden = {
        id: '#ORD-' + contadorID,
        cliente: clienteVal,
        telefono: document.getElementById('telefono').value.trim() || 'N/A',
        equipo: equipoVal,
        falla: document.getElementById('falla').value.trim() || 'Sin diagnóstico',
        tecnico: document.getElementById('tecnico').value,
        total: total,
        abono: abono,
        resta: Math.max(0, total - abono),
        estado: 'En Revision',
        fecha: new Date().toISOString()
      };

      ordenes.unshift(nuevaOrden);
      contadorID++;

      guardarDatos();
      renderizarTodo();

      // Limpiar formulario
      document.getElementById('cliente').value = '';
      document.getElementById('telefono').value = '';
      document.getElementById('equipo').value = '';
      document.getElementById('falla').value = '';
      document.getElementById('montoTotal').value = '0';
      document.getElementById('montoAbono').value = '0';
      calcularSaldo();
      
      cerrarModal();
    }

    function guardarDatos() {
      localStorage.setItem('celupro_ordenes', JSON.stringify(ordenes));
      localStorage.setItem('celupro_contador', contadorID.toString());
    }

    function cargarDatos() {
      const ordenesGuardadas = localStorage.getItem('celupro_ordenes');
      const contadorGuardado = localStorage.getItem('celupro_contador');
      if (ordenesGuardadas) ordenes = JSON.parse(ordenesGuardadas);
      if (contadorGuardado) contadorID = parseInt(contadorGuardado);
    }

    function renderizarTodo() {
      renderizarTarjetas();
      renderizarOrdenes(ordenes);
    }

    function renderizarTarjetas() {
      const mesActual = new Date().getMonth();
      const anoActual = new Date().getFullYear();

      const activas = ordenes.filter(o => o.estado !== 'Entregado').length;
      
      const ordenesMes = ordenes.filter(o => {
        const f = o.fecha ? new Date(o.fecha) : new Date();
        return f.getMonth() === mesActual && f.getFullYear() === anoActual;
      });
      const ingresosMes = ordenesMes.reduce((acc, o) => acc + (o.abono || 0), 0);
      const ingresosTotal = ordenes.reduce((acc, o) => acc + (o.abono || 0), 0);

      const clientesUnicos = new Set(ordenes.map(o => o.cliente.toLowerCase())).size;
      const clientesMes = new Set(ordenesMes.map(o => o.cliente.toLowerCase())).size;

      const pendientes = ordenes.filter(o => o.resta > 0);
      const porCobrar = pendientes.reduce((acc, o) => acc + (o.resta || 0), 0);

      document.getElementById('cardOrdenesActivas').textContent = activas;
      document.getElementById('cardTotalOrdenes').textContent = ${ordenes.length} total;
      document.getElementById('cardIngresosMes').textContent = $${ingresosMes.toFixed(2)};
      document.getElementById('cardIngresosTotal').textContent = $${ingresosTotal.toFixed(2)} histórico;
      document.getElementById('cardClientes').textContent = clientesUnicos;
      document.getElementById('cardClientesMes').textContent = ${clientesMes} este mes;
      document.getElementById('cardPorCobrar').textContent = $${porCobrar.toFixed(2)};
      document.getElementById('cardCantTrans').textContent = ${pendientes.length} pendientes;
    }

    function renderizarOrdenes(lista) {
      const tbody = document.getElementById('listaOrdenes');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-slate-400">No hay órdenes registradas aún.</td></tr>';
        return;
      }

      lista.forEach(function(ord, index) {
        const colorBadge = {
          'En Revision': 'bg-amber-50 text-amber-700 border-amber-200',
          'En Reparacion': 'bg-blue-50 text-blue-700 border-blue-200',
          'Listo': 'bg-emerald-50 text-emerald-700 border-emerald-200',
          'Entregado': 'bg-slate-100 text-slate-700 border-slate-300'
        }[ord.estado] || 'bg-slate-100 text-slate-700 border-slate-300';

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition-colors';
        tr.innerHTML = `
          <td class="py-3.5 px-3 font-mono text-xs text-blue-600 font-bold">${ord.id}</td>
          <td class="py-3.5 px-3 font-medium text-slate-800">${ord.cliente}</td>
          <td class="py-3.5 px-3 text-slate-600">${ord.equipo}</td>
          <td class="py-3.5 px-3">
            <select onchange="cambiarEstado(${index}, this.value)" class="text-xs rounded-full px-2 py-1 font-semibold border ${colorBadge} bg-white cursor-pointer focus:outline-none">
              <option value="En Revision" ${ord.estado === 'En Revision' ? 'selected' : ''}>En Revision</option>
              <option value="En Reparacion" ${ord.estado === 'En Reparacion' ? 'selected' : ''}>En Reparacion</option>
              <option value="Listo" ${ord.estado === 'Listo' ? 'selected' : ''}>Listo</option>
              <option value="Entregado" ${ord.estado === 'Entregado' ? 'selected' : ''}>Entregado</option>
            </select>
          </td>
          <td class="py-3.5 px-3 text-slate-600">${ord.tecnico}</td>
          <td class="py-3.5 px-3 font-semibold text-slate-900">$${ord.total}</td>
          <td class="py-3.5 px-3 text-center">
            <button onclick="borrarOrden(${index})" class="px-2 py-1 bg-rose-50 text-rose-600 border border-rose-200 text-xs rounded-lg hover:bg-rose-100 cursor-pointer">
              Eliminar
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function cambiarEstado(index, nuevoEstado) {
      ordenes[index].estado = nuevoEstado;
      guardarDatos();
      renderizarTodo();
    }

    function borrarOrden(index) {
      if (confirm('¿Seguro que deseas eliminar esta orden?')) {
        ordenes.splice(index, 1);
        guardarDatos();
        renderizarTodo();
      }
    }

    function filtrarOrdenes() {
      const texto = document.getElementById('buscar').value.toLowerCase();
      const filtradas = ordenes.filter(function(o) {
        return o.cliente.toLowerCase().includes(texto) ||
               o.equipo.toLowerCase().includes(texto) ||
               o.id.toLowerCase().includes(texto);
      });
      renderizarOrdenes(filtradas);
    }

    cargarDatos();
    renderizarTodo();
  </script>
</body>
</html>
