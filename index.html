<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celupro - Sistema de Gestion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- PANTALLA DE LOGIN (SIN FORMULARIO) -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-sm w-full shadow-2xl text-center">
            <img src="https://lh3.googleusercontent.com/d/138CSSMy9-2dI3AS_oNIs8l0VttVU9_nb" alt="Celupro Logo" class="w-20 h-20 mx-auto mb-3 object-contain rounded-xl bg-black p-1 border border-slate-700 shadow-md">
            
            <h1 class="text-2xl font-bold tracking-wide text-white">CELUPRO</h1>
            <p class="text-xs text-slate-400 mb-6">Sistema de Gestion de Servicio Tecnico</p>

            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Usuario</label>
                    <input type="text" id="loginUser" value="admin" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Contrasena</label>
                    <input type="password" id="loginPass" value="1234" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                </div>
                
                <!-- BOTON DIRECTO -->
                <button type="button" onclick="entrarAlSistema()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition-all shadow-lg shadow-indigo-600/30">
                    Entrar
                </button>
            </div>
        </div>
    </div>

    <!-- SISTEMA PRINCIPAL -->
    <div id="mainApp" style="display: none;">
        <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img src="https://lh3.googleusercontent.com/d/138CSSMy9-2dI3AS_oNIs8l0VttVU9_nb" alt="Celupro Logo" class="w-12 h-12 object-contain rounded-xl bg-black p-1 border border-slate-700 shadow-lg">
                    <div>
                        <h1 class="text-xl font-bold tracking-wide text-white">CELUPRO</h1>
                        <p class="text-xs text-slate-400">Sistema de Gestion de Servicio Tecnico</p>
                    </div>
                </div>
                <button onclick="cerrarSesion()" class="px-3 py-1.5 bg-rose-600 text-white text-xs font-semibold rounded-lg">
                    Cerrar Sesion
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Formulario Ordenes -->
            <section class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-xl h-fit">
                <h2 class="text-lg font-semibold mb-4 text-indigo-400">Nueva Orden de Reparacion</h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nombre del Cliente</label>
                        <input type="text" id="cliente" placeholder="Ej. Juan Perez" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Telefono (Colombia)</label>
                        <input type="tel" id="telefono" placeholder="Ej. +57 300 1234567" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                    </div>
<div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Equipo / Modelo</label>
                            <input type="text" id="equipo" placeholder="Ej. iPhone 11" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Tecnico Asignado</label>
                            <select id="tecnico" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                                <option value="Robert">Robert</option>
                                <option value="Tecnico 2">Tecnico 2</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Falla / Diagnostico Inicial</label>
                        <textarea id="falla" rows="2" placeholder="Ej. Cambio de pantalla" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white"></textarea>
                    </div>

                    <div class="grid grid-cols-3 gap-2 bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Total ($)</label>
                            <input type="number" id="montoTotal" value="0" min="0" oninput="calcularSaldo()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm font-semibold text-emerald-400">
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Abono ($)</label>
                            <input type="number" id="montoAbono" value="0" min="0" oninput="calcularSaldo()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm font-semibold text-indigo-400">
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Resta ($)</label>
                            <input type="number" id="montoResta" value="0" readonly class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm font-bold text-rose-400 cursor-not-allowed">
                        </div>
                    </div>

                    <button type="button" onclick="agregarOrden()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition-all shadow-lg shadow-indigo-600/30">
                        Guardar Orden
                    </button>
                </div>
            </section>

            <!-- Tabla de Ordenes -->
            <section class="lg:col-span-2 bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-xl">
                <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-4 pb-2 border-b border-slate-700">
                    <h2 class="text-lg font-semibold text-indigo-400">Ordenes Registradas</h2>
                    <input type="text" id="buscar" onkeyup="filtrarOrdenes()" placeholder="Buscar cliente o equipo..." class="px-4 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-sm w-full sm:w-64 text-white">
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="text-xs uppercase bg-slate-900/60 text-slate-400 border-b border-slate-700">
                            <tr>
<th class="py-3 px-3">ID / Cliente</th>
                                <th class="py-3 px-3">Equipo / Falla</th>
                                <th class="py-3 px-3">Estado</th>
                                <th class="py-3 px-3">Pagos</th>
                                <th class="py-3 px-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="listaOrdenes" class="divide-y divide-slate-700/50"></tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script>
        function entrarAlSistema() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            renderizarOrdenes();
        }

        function cerrarSesion() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
        }

        let ordenes = JSON.parse(localStorage.getItem('celupro_ordenes')) || [];
        let contadorID = parseInt(localStorage.getItem('celupro_contador')) || 101;

        function calcularSaldo() {
            const total = parseFloat(document.getElementById('montoTotal').value) || 0;
            const abono = parseFloat(document.getElementById('montoAbono').value) || 0;
            document.getElementById('montoResta').value = Math.max(0, total - abono);
        }

        function agregarOrden() {
            const clienteVal = document.getElementById('cliente').value;
            const equipoVal = document.getElementById('equipo').value;

            if(!clienteVal || !equipoVal) {
                alert('Por favor ingresa al menos el Nombre del Cliente y el Equipo');
                return;
            }

            const total = parseFloat(document.getElementById('montoTotal').value) || 0;
            const abono = parseFloat(document.getElementById('montoAbono').value) || 0;

            const nuevaOrden = {
                id: #ORD-${contadorID},
                cliente: clienteVal,
                telefono: document.getElementById('telefono').value || 'N/A',
                equipo: equipoVal,
                falla: document.getElementById('falla').value || 'Sin diagnostico',
                tecnico: document.getElementById('tecnico').value,
                total: total,
                abono: abono,
                resta: total - abono,
                estado: 'En Revision'
            };

            ordenes.unshift(nuevaOrden);
            contadorID++;
            guardarDatos();
            renderizarOrdenes();
            
            // Limpiar campos
            document.getElementById('cliente').value = '';
            document.getElementById('telefono').value = '';
            document.getElementById('equipo').value = '';
            document.getElementById('falla').value = '';
            document.getElementById('montoTotal').value = '0';
            document.getElementById('montoAbono').value = '0';
            calcularSaldo();
        }

        function cambiarEstado(index, nuevoEstado) {
            ordenes[index].estado = nuevoEstado;
            guardarDatos();
            renderizarOrdenes();
        }

        function eliminarOrden(index) {
            if(confirm('Seguro que deseas eliminar esta orden?')) {
                ordenes.splice(index, 1);
                guardarDatos();
                renderizarOrdenes();
            }
        }

        function guardarDatos() {
            localStorage.setItem('celupro_ordenes', JSON.stringify(ordenes));
            localStorage.setItem('celupro_contador', contadorID.toString());
        }

        function renderizarOrdenes(lista = ordenes) {
            const tbody = document.getElementById('listaOrdenes');
            if(!tbody) return;
            tbody.innerHTML = '';
if (lista.length === 0) {
                tbody.innerHTML = <tr><td colspan="5" class="text-center py-6 text-slate-500">No hay ordenes registradas aun.</td></tr>;
                return;
            }

            lista.forEach((ord, index) => {
                const colorEstado = {
                    'En Revision': 'bg-amber-500/10 text-amber-400 border-amber-500/20',
                    'En Reparacion': 'bg-blue-500/10 text-blue-400 border-blue-500/20',
                    'Listo': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
                    'Entregado': 'bg-slate-700/50 text-slate-400 border-slate-600'
                }[ord.estado] || 'bg-slate-700/50 text-slate-400 border-slate-600';

                tbody.innerHTML += 
                    <tr class="hover:bg-slate-700/30 transition-colors">
                        <td class="py-3 px-3">
                            <span class="font-mono text-xs text-indigo-400 font-bold block">${ord.id}</span>
                            <span class="font-medium text-white">${ord.cliente}</span>
                            <span class="block text-xs text-slate-400">${ord.telefono}</span>
                        </td>
                        <td class="py-3 px-3">
                            <span class="font-medium text-white block">${ord.equipo}</span>
                            <span class="text-xs text-slate-400 line-clamp-1">${ord.falla}</span>
                            <span class="text-[10px] text-slate-500">Tec: ${ord.tecnico}</span>
                        </td>
                        <td class="py-3 px-3">
                            <select onchange="cambiarEstado(${index}, this.value)" class="text-xs rounded-full px-2 py-1 font-semibold border ${colorEstado} bg-slate-900 focus:outline-none cursor-pointer text-white">
                                <option value="En Revision" ${ord.estado === 'En Revision' ? 'selected' : ''}>En Revision</option>
                                <option value="En Reparacion" ${ord.estado === 'En Reparacion' ? 'selected' : ''}>En Reparacion</option>
                                <option value="Listo" ${ord.estado === 'Listo' ? 'selected' : ''}>Listo</option>
                                <option value="Entregado" ${ord.estado === 'Entregado' ? 'selected' : ''}>Entregado</option>
                            </select>
                        </td>
                        <td class="py-3 px-3 text-xs">
                            <span class="block">Total: <strong class="text-white">$${ord.total}</strong></span>
                            <span class="block text-emerald-400">Abono: $${ord.abono}</span>
                            <span class="block text-rose-400 font-bold">Resta: $${ord.resta}</span>
                        </td>
                        <td class="py-3 px-3 text-center">
                            <button onclick="eliminarOrden(${index})" class="px-2 py-1 bg-rose-500/20 text-rose-400 text-xs rounded hover:bg-rose-500/40">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                ;
            });
        }

        function filtrarOrdenes() {
            const texto = document.getElementById('buscar').value.toLowerCase();
            const filtradas = ordenes.filter(o => 
                o.cliente.toLowerCase().includes(texto) || 
                o.equipo.toLowerCase().includes(texto) ||
                o.id.toLowerCase().includes(texto)
            );
            renderizarOrdenes(filtradas);
        }
   // Forzar el inicio de sesión
document.addEventListener('DOMContentLoaded', function() {
  const loginScreen = document.getElementById('loginScreen');
  if (loginScreen) {
    const btnEntrar = loginScreen.querySelector('button');
    if (btnEntrar) {
      btnEntrar.addEventListener('click', function(e) {
        e.preventDefault();
        loginScreen.style.display = 'none';
      });
    }
  }
});
    </script>
</body>
</html>
