<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celupro - Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f1f5f9; color: #334155; padding-bottom: 30px; }
    
    /* Header */
    header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .logo-container { display: flex; items-center; gap: 12px; }
    .logo-box { width: 40px; height: 40px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; }
    .title-box h1 { font-size: 18px; color: #0f172a; }
    .title-box p { font-size: 12px; color: #64748b; }
    
    .reloj-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 16px; border-radius: 10px; text-align: center; }
    #fecha-colombia { font-size: 12px; font-weight: bold; color: #334155; }
    #reloj-colombia { font-size: 15px; font-weight: 800; color: #2563eb; font-family: monospace; }
    
    .btn-principal { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-principal:hover { background: #1d4ed8; }

    /* Layout Principal */
    main { max-width: 1200px; margin: 24px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 24px; }
    
    /* Tarjetas */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card { background: #fff; border: 1px solid #e2e8f0; padding: 18px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; }
    .card p { font-size: 12px; color: #64748b; }
    .card h3 { font-size: 22px; color: #0f172a; margin: 4px 0; }
    .card span { font-size: 11px; color: #94a3b8; }
    .card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: #eff6ff; }

    /* Tabla */
    .table-container { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; }
    .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .search-input { border: 1px solid #e2e8f0; background: #f8fafc; padding: 8px 12px; border-radius: 8px; font-size: 12px; width: 240px; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #f8fafc; color: #64748b; padding: 10px; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #f1f5f9; }
    td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; }
    
    /* Modal */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
    .modal-content { background: #fff; border-radius: 16px; width: 100%; max-width: 480px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #94a3b8; }
    
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; color: #64748b; font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { border: 1px solid #cbd5e1; background: #f8fafc; padding: 8px; border-radius: 8px; font-size: 12px; width: 100%; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    
    .btn-danger { background: #ffe4e6; color: #e11d48; border: 1px solid #fecdd3; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo-container">
      <div class="logo-box">CP</div>
      <div class="title-box">
        <h1>CELUPRO</h1>
        <p>Sistema de Gestión</p>
      </div>
    </div>

    <div class="reloj-box">
      <div id="fecha-colombia">Cargando...</div>
      <div id="reloj-colombia">00:00:00</div>
    </div>

    <button type="button" class="btn-principal" onclick="abrirModal()">+ Crear Nueva Orden</button>
  </header>

  <!-- MAIN CONTAINER -->
  <main>
    <div class="cards-grid">
      <div class="card">
        <div>
          <p>Órdenes activas</p>
          <h3 id="cardOrdenesActivas">0</h3>
          <span id="cardTotalOrdenes">0 total</span>
        </div>
        <div class="card-icon">📋</div>
      </div>
      <div class="card">
        <div>
          <p>Ingresos del mes</p>
          <h3 id="cardIngresosMes">$0.00</h3>
          <span id="cardIngresosTotal">$0.00 histórico</span>
        </div>
        <div class="card-icon">💲</div>
      </div>
      <div class="card">
        <div>
          <p>Clientes</p>
          <h3 id="cardClientes">0</h3>
          <span id="cardClientesMes">0 este mes</span>
        </div>
        <div class="card-icon">👥</div>
      </div>
      <div class="card">
        <div>
          <p>Por Cobrar</p>
          <h3 id="cardPorCobrar" style="color:#e11d48;">$0.00</h3>
          <span id="cardCantTrans">0 pendientes</span>
        </div>
        <div class="card-icon">💳</div>
      </div>
    </div>

    <div class="table-container">
      <div class="table-header">
        <h3>Órdenes recientes</h3>
        <input type="text" id="buscar" class="search-input" oninput="filtrarOrdenes()" placeholder="Buscar cliente, equipo o ID...">
      </div>

      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ORDEN</th>
              <th>CLIENTE</th>
              <th>EQUIPO</th>
              <th>ESTADO</th>
              <th>TÉCNICO</th>
              <th>COSTO</th>
              <th style="text-align:center;">ACCIONES</th>
            </tr>
          </thead>
          <tbody id="listaOrdenes"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL NUEVA ORDEN -->
  <div id="modalOrden" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Crear Nueva Orden</h3>
        <button type="button" class="close-btn" onclick="cerrarModal()">&times;</button>
      </div>

      <div class="form-group">
        <label>Nombre del Cliente</label>
        <input type="text" id="cliente" placeholder="Ej: Eugenio">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" id="telefono" placeholder="Ej: 300123456">
      </div>

      <div class="form-group">
        <label>Equipo / Modelo</label>
        <input type="text" id="equipo" placeholder="Ej: iPhone 15">
      </div>

      <div class="form-group">
        <label>Técnico Asignado</label>
        <select id="tecnico">
          <option value="Robert">Robert</option>
          <option value="Técnico 2">Técnico 2</option>
        </select>
      </div>

      <div class="form-group">
        <label>Falla / Diagnóstico Inicial</label>
        <textarea id="falla" rows="2" placeholder="Describa la falla..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Total ($)</label>
          <input type="number" id="montoTotal" value="0" oninput="calcularSaldo()">
        </div>
        <div class="form-group">
          <label>Abono ($)</label>
          <input type="number" id="montoAbono" value="0" oninput="calcularSaldo()">
        </div>
        <div class="form-group">
          <label>Resta ($)</label>
          <input type="number" id="montoResta" value="0" readonly style="color:#e11d48; font-weight:bold;">
        </div>
      </div>

      <button type="button" class="btn-principal" style="width:100%; margin-top:10px;" onclick="guardarOrden()">Guardar Orden</button>
    </div>
  </div>

  <script>
    // RELOJ DIRECTO (Sin dependencias externas)
    function actualizarReloj() {
      const ahora = new Date();
      const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

      const fechaStr = ${dias[ahora.getDay()]}, ${ahora.getDate()} de ${meses[ahora.getMonth()]} de ${ahora.getFullYear()};
      
      let hrs = ahora.getHours();
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      hrs = hrs % 12 || 12;
      const min = String(ahora.getMinutes()).padStart(2, '0');
      const sec = String(ahora.getSeconds()).padStart(2, '0');
      const horaStr = ${hrs}:${min}:${sec} ${ampm};

      document.getElementById('fecha-colombia').textContent = fechaStr;
      document.getElementById('reloj-colombia').textContent = horaStr;
    }
    
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // MODAL Y LÓGICA DE ÓRDENES
    let ordenes = [];
    let contadorID = 101;

    function abrirModal() {
      document.getElementById('modalOrden').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modalOrden').style.display = 'none';
    }

    function calcularSaldo() {
      const total = parseFloat(document.getElementById('montoTotal').value) || 0;
      const abono = parseFloat(document.getElementById('montoAbono').value) || 0;
      document.getElementById('montoResta').value = Math.max(0, total - abono);
    }

    function guardarOrden() {
      const clienteVal = document.getElementById('cliente').value.trim();
      const equipoVal = document.getElementById('equipo').value.trim();

      if (!clienteVal || !equipoVal) {
        alert('Ingresa el nombre del Cliente y el Equipo.');
        return;
      }

      const total = parseFloat(document.getElementById('montoTotal').value) || 0;
      const abono = parseFloat(document.getElementById('montoAbono').value) || 0;
      const resta = Math.max(0, total - abono);

      const nuevaOrden = {
        id: '#ORD-' + contadorID,
        cliente: clienteVal,
        telefono: document.getElementById('telefono').value.trim() || 'N/A',
        equipo: equipoVal,
        falla: document.getElementById('falla').value.trim() || 'Sin diagnóstico',
        tecnico: document.getElementById('tecnico').value,
        total: total,
        abono: abono,
        resta: resta,
        estado: 'En Revision',
        fecha: new Date().toISOString()
      };

      ordenes.unshift(nuevaOrden);
      contadorID++;

      // Guardar y renderizar
      localStorage.setItem('celupro_ordenes', JSON.stringify(ordenes));
      localStorage.setItem('celupro_contador', contadorID.toString());

      renderizarTodo();

      // Resetear campos
      document.getElementById('cliente').value = '';
      document.getElementById('telefono').value = '';
      document.getElementById('equipo').value = '';
      document.getElementById('falla').value = '';
      document.getElementById('montoTotal').value = '0';
      document.getElementById('montoAbono').value = '0';
      document.getElementById('montoResta').value = '0';

      cerrarModal();
    }

    function cargarDatos() {
      const ordenesGuardadas = localStorage.getItem('celupro_ordenes');
      const contadorGuardado = localStorage.getItem('celupro_contador');
      if (ordenesGuardadas) ordenes = JSON.parse(ordenesGuardadas);
      if (contadorGuardado) contadorID = parseInt(contadorGuardado);
    }

    function renderizarTodo() {
      renderizarTarjetas();
      renderizarOrdenes(ordenes);
    }

    function renderizarTarjetas() {
      const activas = ordenes.filter(o => o.estado !== 'Entregado').length;
      const ingresosTotal = ordenes.reduce((acc, o) => acc + (o.abono || 0), 0);
      const clientesUnicos = new Set(ordenes.map(o => o.cliente.toLowerCase())).size;
      const porCobrar = ordenes.reduce((acc, o) => acc + (o.resta || 0), 0);

      document.getElementById('cardOrdenesActivas').textContent = activas;
      document.getElementById('cardTotalOrdenes').textContent = ${ordenes.length} total;
      document.getElementById('cardIngresosMes').textContent = $${ingresosTotal.toFixed(2)};
      document.getElementById('cardClientes').textContent = clientesUnicos;
      document.getElementById('cardPorCobrar').textContent = $${porCobrar.toFixed(2)};
    }

    function renderizarOrdenes(lista) {
      const tbody = document.getElementById('listaOrdenes');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#94a3b8;">No hay órdenes registradas aún.</td></tr>';
        return;
      }

      lista.forEach((ord, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color:#2563eb; font-weight:bold;">${ord.id}</td>
          <td><b>${ord.cliente}</b></td>
          <td>${ord.equipo}</td>
          <td>
            <select onchange="cambiarEstado(${index}, this.value)">
              <option value="En Revision" ${ord.estado === 'En Revision' ? 'selected' : ''}>En Revision</option>
              <option value="En Reparacion" ${ord.estado === 'En Reparacion' ? 'selected' : ''}>En Reparacion</option>
              <option value="Listo" ${ord.estado === 'Listo' ? 'selected' : ''}>Listo</option>
              <option value="Entregado" ${ord.estado === 'Entregado' ? 'selected' : ''}>Entregado</option>
            </select>
          </td>
          <td>${ord.tecnico}</td>
          <td><b>$${ord.total}</b></td>
          <td style="text-align:center;">
            <button class="btn-danger" onclick="borrarOrden(${index})">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function cambiarEstado(index, nuevoEstado) {
      ordenes[index].estado = nuevoEstado;
      localStorage.setItem('celupro_ordenes', JSON.stringify(ordenes));
      renderizarTodo();
    }

    function borrarOrden(index) {
      if (confirm('¿Deseas borrar esta orden?')) {
        ordenes.splice(index, 1);
        localStorage.setItem('celupro_ordenes', JSON.stringify(ordenes));
        renderizarTodo();
      }
    }

    function filtrarOrdenes() {
      const q = document.getElementById('buscar').value.toLowerCase();
      const res = ordenes.filter(o => o.cliente.toLowerCase().includes(q) || o.equipo.toLowerCase().includes(q) || o.id.toLowerCase().includes(q));
      renderizarOrdenes(res);
    }

    cargarDatos();
    renderizarTodo();
  </script>
</body>
</html>
