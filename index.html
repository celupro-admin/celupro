<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celupro - Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f1f5f9; color: #334155; padding-bottom: 30px; }
    
    header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .logo-container { display: flex; align-items: center; gap: 12px; }
    .logo-img { height: 45px; width: auto; max-width: 160px; object-fit: contain; }
    .title-box h1 { font-size: 18px; color: #0f172a; line-height: 1.2; }
    .title-box p { font-size: 12px; color: #64748b; }
    
    .btn-principal { background: #2563eb; color: #fff; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 14px; text-align: center; }
    .btn-principal:hover { background: #1d4ed8; }

    main { max-width: 1200px; margin: 20px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 20px; }
    
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .card { background: #fff; border: 1px solid #e2e8f0; padding: 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; }
    .card p { font-size: 12px; color: #64748b; font-weight: 500; }
    .card h3 { font-size: 22px; color: #0f172a; margin: 4px 0; font-weight: bold; }
    .card span { font-size: 11px; color: #94a3b8; }
    .card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: #f8fafc; }

    .table-container { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; }
    .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .search-input { border: 1px solid #cbd5e1; background: #f8fafc; padding: 10px 12px; border-radius: 10px; font-size: 13px; width: 100%; max-width: 300px; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #f8fafc; color: #64748b; padding: 10px; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; }
    td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; }
    
    .modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); z-index: 99999; justify-content: center; align-items: center; padding: 16px; }
    .modal-content { background: #fff; border-radius: 16px; width: 100%; max-width: 480px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
    .modal-header h3 { font-size: 16px; color: #0f172a; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8; }
    
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; color: #64748b; font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { border: 1px solid #cbd5e1; background: #f8fafc; padding: 10px; border-radius: 8px; font-size: 13px; width: 100%; outline: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #f1f5f9; color: #475569; display: inline-block; }
    .btn-danger { background: #ffe4e6; color: #e11d48; border: 1px solid #fecdd3; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/138CSSMy9-2dI3AS_oNIs8l0VttVU9_nb" alt="CELUPRO Logo" class="logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x45?text=CELUPRO';">
      <div class="title-box">
        <h1>CELUPRO</h1>
        <p>Sistema de Gestión</p>
      </div>
    </div>

    <button type="button" class="btn-principal" id="btnAbrirModal">+ Crear Nueva Orden</button>
  </header>

  <main>
    <div class="cards-grid">
      <div class="card">
        <div>
          <p>Órdenes activas</p>
          <h3 id="cardOrdenesActivas">0</h3>
          <span id="cardTotalOrdenes">0 total</span>
        </div>
        <div class="card-icon">📋</div>
      </div>
      <div class="card">
        <div>
          <p>Ingresos del mes</p>
          <h3 id="cardIngresosMes">$0.00</h3>
          <span id="cardIngresosTotal">$0.00 histórico</span>
        </div>
        <div class="card-icon">💲</div>
      </div>
      <div class="card">
        <div>
          <p>Clientes</p>
          <h3 id="cardClientes">0</h3>
          <span id="cardClientesMes">0 este mes</span>
        </div>
        <div class="card-icon">👥</div>
      </div>
      <div class="card">
        <div>
          <p>Por Cobrar</p>
          <h3 id="cardPorCobrar" style="color:#e11d48;">$0.00</h3>
          <span id="cardCantTrans">0 pendientes</span>
        </div>
        <div class="card-icon">💳</div>
      </div>
    </div>

    <div class="table-container">
      <div class="table-header">
        <h3 style="font-size:16px; color:#0f172a;">Órdenes recientes</h3>
        <input type="text" id="buscar" class="search-input" placeholder="Buscar cliente, equipo o ID...">
      </div>

      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ORDEN</th>
              <th>CLIENTE</th>
              <th>EQUIPO</th>
              <th>ESTADO</th>
              <th>TÉCNICO</th>
              <th>COSTO</th>
              <th style="text-align:center;">ACCIONES</th>
            </tr>
          </thead>
          <tbody id="listaOrdenes"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="modalOrden" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Crear Nueva Orden de Reparación</h3>
        <button type="button" class="close-btn" id="btnCerrarModal">&times;</button>
      </div>

      <div class="form-group">
        <label>Nombre del Cliente</label>
        <input type="text" id="cliente" placeholder="Ej: Eugenio">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" id="telefono" placeholder="Ej: 300123456">
      </div>

      <div class="form-group">
        <label>Equipo / Modelo</label>
        <input type="text" id="equipo" placeholder="Ej: iPhone 15">
      </div>

      <div class="form-group">
        <label>Técnico Asignado</label>
        <select id="tecnico">
          <option value="Robert">Robert</option>
          <option value="Andrés Anzola">Andrés Anzola</option>
        </select>
      </div>

      <div class="form-group">
        <label>Falla / Diagnóstico Inicial</label>
        <textarea id="falla" rows="2" placeholder="Describa la falla..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Total ($)</label>
          <input type="number" id="montoTotal" value="0">
        </div>
        <div class="form-group">
          <label>Abono ($)</label>
          <input type="number" id="montoAbono" value="0">
        </div>
        <div class="form-group">
          <label>Resta ($)</label>
          <input type="number" id="montoResta" value="0" readonly style="color:#e11d48; font-weight:bold;">
        </div>
      </div>

      <button type="button" class="btn-principal" id="btnGuardarOrden" style="width:100%; margin-top:10px;">Guardar Orden</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      let ordenes = [];
      let contadorID = 101;

      const modal = document.getElementById('modalOrden');
      const btnAbrirModal = document.getElementById('btnAbrirModal');
      const btnCerrarModal = document.getElementById('btnCerrarModal');
      const btnGuardarOrden = document.getElementById('btnGuardarOrden');
      const montoTotalInput = document.getElementById('montoTotal');
      const montoAbonoInput = document.getElementById('montoAbono');
      const buscarInput = document.getElementById('buscar');

      btnAbrirModal.addEventListener('click', function() {
        modal.style.display = 'flex';
      });

      btnCerrarModal.addEventListener('click', function() {
        modal.style.display = 'none';
      });

      function calcularResta() {
        const total = parseFloat(montoTotalInput.value) || 0;
        const abono = parseFloat(montoAbonoInput.value) || 0;
        const resta = total - abono;
        document.getElementById('montoResta').value = resta > 0 ? resta : 0;
      }

      montoTotalInput.addEventListener('input', calcularResta);
      montoAbonoInput.addEventListener('input', calcularResta);

      btnGuardarOrden.addEventListener('click', function() {
        const clienteVal = document.getElementById('cliente').value.trim();
        const equipoVal = document.getElementById('equipo').value.trim();

        if (!clienteVal || !equipoVal) {
          alert('Ingresa el Nombre del Cliente y el Equipo.');
          return;
        }

        const total = parseFloat(montoTotalInput.value) || 0;
        const abono = parseFloat(montoAbonoInput.value) || 0;

        if (abono > total) {
          alert('El abono no puede ser mayor al total.');
          return;
        }

        const nuevaOrden = {
          id: '#ORD-' + contadorID,
          cliente: clienteVal,
          telefono: document.getElementById('telefono').value.trim() || 'N/A',
          equipo: equipoVal,
          falla: document.getElementById('falla').value.trim() || 'Sin diagnóstico',
          tecnico: document.getElementById('tecnico').value,
          total: total,
          abono: abono,
          resta: Math.max(0, total - abono),
          estado: 'En Revision'
        };

        ordenes.unshift(nuevaOrden);
        contadorID++;

        localStorage.setItem('celupro_ordenes', JSON.stringify(ordenes));
        localStorage.setItem('celupro_contador', contadorID.toString());

        renderizarTodo();

        document.getElementById('cliente').value = '';
        document.getElementById('telefono').value = '';
        document.getElementById('equipo').value = '';
        document.getElementById('falla').value = '';
        montoTotalInput.value = '0';
        montoAbonoInput.value = '0';
        document.getElementById('montoResta').value = '0';

        modal.style.display = 'none';
      });

      function cargarDatos() {
        const ords = localStorage.getItem('celupro_ordenes');
        const cnt = localStorage.getItem('celupro_contador');
        if (ords) ordenes = JSON.parse(ords);
        if (cnt) contadorID = parseInt(cnt);
      }

      function renderizarTodo() {
        const activas = ordenes.filter(o => o.estado !== 'Entregado').length;
        const ingresosTotal = ordenes.reduce((acc, o) => acc + (o.abono || 0), 0);
        const clientesUnicos = new Set(ordenes.map(o => o.cliente.toLowerCase())).size;
        const porCobrar = ordenes.reduce((acc, o) => acc + (o.resta || 0), 0);

        document.getElementById('cardOrdenesActivas').textContent = activas;
        document.getElementById('cardTotalOrdenes').textContent = ${ordenes.length} total;
        document.getElementById('cardIngresosMes').textContent = $${ingresosTotal.toFixed(2)};
        document.getElementById('cardClientes').textContent = clientesUnicos;
        document.getElementById('cardPorCobrar').textContent = $${porCobrar.toFixed(2)};

        renderizarOrdenes(ordenes);
      }

      function renderizarOrdenes(lista) {
        const tbody = document.getElementById('listaOrdenes');
        tbody.innerHTML = '';

        if (lista.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#94a3b8;">No hay órdenes registradas aún.</td></tr>';
          return;
        }

        lista.forEach((ord, index) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="color:#2563eb; font-weight:bold;">${ord.id}</td>
            <td><b>${ord.cliente}</b></td>
            <td>${ord.equipo}</td>
            <td><span class="badge">${ord.estado}</span></td>
            <td>${ord.tecnico}</td>
            <td><b>$${ord.total}</b></td>
            <td style="text-align:center;">
              <button class="btn-danger" data-idx="${index}">Eliminar</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        document.querySelectorAll('.btn-danger').forEach(btn => {
          btn.addEventListener('click', function() {
            const idx = this.getAttribute('data-idx');
            if (confirm('¿Eliminar esta orden?')) {
              ordenes.splice(idx, 1);
              localStorage.setItem('celupro_ordenes', JSON.stringify(ordenes));
              renderizarTodo();
            }
          });
        });
      }

      buscarInput.addEventListener('input', function() {
        const q = buscarInput.value.toLowerCase();
        const filtradas = ordenes.filter(o => o.cliente.toLowerCase().includes(q) || o.equipo.toLowerCase().includes(q) || o.id.toLowerCase().includes(q));
        renderizarOrdenes(filtradas);
      });

      cargarDatos();
      renderizarTodo();
    });
  </script>
</body>
</html>
